baseURL = "/Microbit-Competitive-Robotics/"
title = "Competitive Robotics"
theme = "hugo-theme-voidmain"
enableEmoji = true

# Mount course.yml as Hugo data so templates can read it
# directly via .Site.Data.course — no need to duplicate fields.
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "../course.yml"
  target = "data/course.yml"
# Re-add the default data/ mount (declaring module.mounts disables it otherwise),
# so generated site/data/parts3d.json loads as .Site.Data.parts3d.
[[module.mounts]]
  source = "data"
  target = "data"
# Publish the working course outline as a section of the site. The outline is
# a Curik outline document (edit it there, not here), so the site and the
# planning document are one file and cannot drift.
[[module.mounts]]
  source = "../.course/outlines/course-outline.md"
  target = "content/outline/_index.md"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  description = "A competitive robotics class where students build a micro:bit robot on the ElecFreaks Nezha board, drive it by joystick, add line and color sensing, then move to closed-loop drive code with calibration, motion profiles and PID control."
  copyright = "The League of Amazing Programmers"
  license = "CC BY-NC 4.0"
  curriculum_version = "0.20261001.1"
  curik_version = "0.20260519.1"
  instructorGuide = true
